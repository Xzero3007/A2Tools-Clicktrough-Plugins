<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="tabs" role="tablist">
      <span class="navBtns"><button type="button" class="navBack" title="Back (Alt+←)" aria-label="Back" disabled>←</button><button type="button" class="navFwd" title="Forward (Alt+→)" aria-label="Forward" disabled>→</button></span>
      <button type="button" class="tab" data-tab="twitch" role="tab">Twitch</button>
      <button type="button" class="tab" data-tab="youtube" role="tab">YouTube</button>
      <button type="button" class="tab" data-tab="jellyfin" role="tab">Jellyfin</button>
    </nav>

    <section class="pane" data-pane="twitch">
      <div class="controls">
        <span class="seg views" role="group" aria-label="What to show">
          <button type="button" data-view="favs">Favourites</button><button type="button" data-view="aion">AION 2</button><button type="button" data-view="all">All live</button><button type="button" data-view="search" hidden>Search</button>
        </span>
        <form class="searchForm" data-for="twitch">
          <input type="search" class="search" placeholder="Search a channel, or its name to play" autocomplete="off" spellcheck="false" />
        </form>
        <button type="button" class="refresh" title="Get the list again">Update</button>
      </div>
      <div class="status muted"></div>
      <div class="list"></div>
    </section>

    <section class="pane" data-pane="youtube">
      <div class="controls">
        <span class="seg views" role="group" aria-label="What to show">
          <button type="button" data-view="subs">Subscriptions</button><button type="button" data-view="channels">Channels</button><button type="button" data-view="search" hidden>Search</button>
        </span>
        <form class="searchForm" data-for="youtube">
          <input type="search" class="search" placeholder="Search YouTube, or paste a video link" autocomplete="off" spellcheck="false" />
        </form>
        <button type="button" class="refresh" title="Get the list again">Update</button>
      </div>
      <div class="status muted"></div>
      <div class="list"></div>
    </section>

    <section class="pane" data-pane="jellyfin">
      <!-- Not signed in: the server's address and the sign-in. -->
      <form class="jfLogin" hidden autocomplete="off">
        <p class="muted">Your own Jellyfin server, in your home network only. The address and the server's key stay on this PC (the meter's own folder); the password isn't kept.</p>
        <label>Server <input type="text" name="server" placeholder="192.168.1.20:8096" spellcheck="false" /></label>
        <label>User <input type="text" name="user" spellcheck="false" /></label>
        <label>Password <input type="password" name="password" /></label>
        <div class="jfLoginRow"><button type="submit">Sign in</button><span class="jfLoginState muted"></span></div>
      </form>
      <div class="jfMain" hidden>
        <div class="controls">
          <span class="seg views" role="group" aria-label="What to show">
            <button type="button" data-view="home">Home</button><button type="button" data-view="library">Libraries</button><button type="button" data-view="search" hidden>Search</button>
          </span>
          <form class="searchForm" data-for="jellyfin">
            <input type="search" class="search" placeholder="Search films, shows and episodes" autocomplete="off" spellcheck="false" />
          </form>
          <button type="button" class="refresh" title="Get the list again">Update</button>
        </div>
        <div class="jfOptions muted">
          <label title="Jumps over intros, recaps, credits and previews by itself where your server knows them (Media Segments, or the Intro Skipper plugin)"><input type="checkbox" class="jfAutoSkip" /> Skip intros by themselves</label>
          <label title="When an episode ends, the next one starts"><input type="checkbox" class="jfAutoNext" /> Play the next episode</label>
          <span class="jfAccount"></span>
          <button type="button" class="jfLogout" title="Sign out: the meter forgets the server's key">Sign out</button>
        </div>
        <div class="crumbs"></div>
        <div class="status muted"></div>
        <div class="list"></div>
      </div>
    </section>

    <footer class="player" hidden>
      <div class="seekRow" hidden>
        <button type="button" class="prevEp" title="The episode before" aria-label="The episode before" hidden>⏮ Previous</button>
        <button type="button" class="back" title="Back 10 seconds">−10 s</button>
        <span class="time">0:00</span>
        <input type="range" class="seek" min="0" max="1000" step="1" value="0" aria-label="Position" />
        <span class="total">0:00</span>
        <button type="button" class="fwd" title="On 30 seconds">+30 s</button>
        <button type="button" class="nextEp" title="The next episode" aria-label="The next episode" hidden>Next ⏭</button>
        <button type="button" class="skipBtn" hidden></button>
        <select class="audioTrack" title="Audio track"></select>
        <select class="subTrack" title="Subtitles"></select>
      </div>
      <span class="seg slotSwitch" role="group" aria-label="Which player these controls are for" hidden><button type="button" data-slot="twitch">Twitch</button><button type="button" data-slot="youtube">YouTube</button><button type="button" data-slot="jellyfin">Jellyfin</button></span>
      <div class="now">
        <span class="dot" aria-hidden="true"></span>
        <div class="nowText"><strong class="nowTitle"></strong><span class="nowState muted"></span></div>
      </div>
      <button type="button" class="pause" title="Pause or play" aria-label="Pause or play">❚❚</button>
      <button type="button" class="mute" title="Mute" aria-label="Mute">🔊</button>
      <input type="range" class="volume" min="0" max="100" step="1" title="Volume" aria-label="Volume" />
      <label class="opacityBox" title="How see-through the video is over the game"><span aria-hidden="true">◐</span><input type="range" class="opacity" min="20" max="100" step="5" aria-label="Video opacity" /><span class="opacityValue"></span></label>
      <select class="quality" title="Quality (a change starts the video again)">
        <option value="original">Original</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
        <option value="audio">Sound only</option>
      </select>
      <span class="seg sizes" role="group" aria-label="Overlay size" title="The overlay's size (or drag a corner of it while the meter is unlocked)">
        <button type="button" data-size="s">S</button><button type="button" data-size="m">M</button><button type="button" data-size="l">L</button><button type="button" data-size="xl">XL</button>
      </span>
      <button type="button" class="stop" title="Stop and close the overlay">Stop</button>
    </footer>

    <script src="/_sdk/a2.js"></script>
    <script src="lists.js"></script>
    <script src="jellyfin.js"></script>
    <script src="plugin.js"></script>
  </body>
</html>
